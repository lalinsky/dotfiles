theme = "ayu_mirage"

[editor]
color-modes = true
auto-pairs = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "block"

[editor.lsp]
display-messages = true
auto-signature-help	= true
display-signature-help-docs	= true

[keys.normal]
# Muscle memory
"{" = ["extend_to_line_bounds", "goto_prev_paragraph", "collapse_selection"]
"}" = ["extend_to_line_bounds", "goto_next_paragraph", "collapse_selection"]

V = ["select_mode", "extend_to_line_bounds"]

# Make j and k behave as they do Vim when soft-wrap is enabled
up = "move_line_up"
k = "move_line_up"
down = "move_line_down"
j = "move_line_down"

C-up = ["move_line_up"]
C-down = ["move_line_down"]
C-right = ["move_next_word_start", "move_char_right", "collapse_selection"]
C-left = ["move_prev_word_start", "collapse_selection"]

# Search for word under cursor
"*" = ["move_char_right", "move_prev_word_start", "move_next_word_end", "search_selection", "search_next"]
"#" = ["move_char_right", "move_prev_word_start", "move_next_word_end", "search_selection", "search_prev"]

# Escape the madness! No more fighting with the cursor! Or with multiple cursors!
esc = ["collapse_selection", "keep_primary_selection"]

[keys.insert]
C-left = "move_prev_word_start"
C-right = "move_next_word_start"

[keys.select]
# Muscle memory
"{" = ["extend_to_line_bounds", "goto_prev_paragraph", "collapse_selection"]
"}" = ["extend_to_line_bounds", "goto_next_paragraph", "collapse_selection"]

# Make selecting lines in visual mode behave sensibly
up = ["extend_line_up", "extend_to_line_bounds"]
down = ["extend_line_down", "extend_to_line_bounds"]
k = ["extend_line_up", "extend_to_line_bounds"]
j = ["extend_line_down", "extend_to_line_bounds"]

# Escape the madness! No more fighting with the cursor! Or with multiple cursors!
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
